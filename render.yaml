services:
  # Backend API Service
  - type: web
    name: secondlife-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: secondlife-db
          property: connectionString

  # Frontend Static Site
  - type: staticSite
    name: secondlife-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: secondlife-db
    plan: free
    region: oregon
